name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (x.y.z)"
        required: true

# One release at a time, never cancelled: the TestFlight upload can't be undone,
# and the tag is only created after it succeeds.
concurrency:
  group: release
  cancel-in-progress: false

# Push the version bump commit and tag, create the GitHub Release.
permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60

    env:
      VERSION: ${{ inputs.version }}
      TUIST_VERSION: 4.200.5
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      # Read directly by fastlane's app_store_connect_api_key action.
      APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
      APP_STORE_CONNECT_API_KEY_IS_KEY_CONTENT_BASE64: "true"

    steps:
      # Validate before anything is mutated: the value ends up in git and fastlane commands.
      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version: '$VERSION' (expected strict x.y.z)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure tag does not already exist
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag '$VERSION' already exists. Release the next version instead."
            exit 1
          fi

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # From the GitHub release, not Homebrew: the tuist tap's cask breaks on Homebrew 6 (tuist/homebrew-tuist#41).
      - name: Install Tuist
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tuist.zip" "https://github.com/tuist/tuist/releases/download/$TUIST_VERSION/tuist.zip"
          mkdir -p "$RUNNER_TEMP/tuist"
          unzip -q "$RUNNER_TEMP/tuist.zip" -d "$RUNNER_TEMP/tuist"
          echo "$RUNNER_TEMP/tuist" >> "$GITHUB_PATH"

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # match clones the private certificates repo over HTTPS with base64("user:PAT").
      - name: Set up match git authorization
        env:
          PAT: ${{ secrets.MATCH_GITHUB_PAT }}
        run: |
          auth=$(printf '%s' "devxoul:${PAT}" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$auth" >> "$GITHUB_ENV"

      # Commits locally only; pushed after the upload succeeds.
      - name: Bump version
        run: bundle exec fastlane bump version:"$VERSION"

      # Notarized Mac app into build/fastlane/, then the iPhone app to TestFlight.
      - name: Build and upload
        run: bundle exec fastlane release

      # Kept so the publish job can be re-run without rebuilding or re-uploading to TestFlight.
      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            build/fastlane/Unteams-${{ inputs.version }}.zip
            build/fastlane/Unteams-${{ inputs.version }}.dmg
          if-no-files-found: error

      - name: Push commit and tag
        run: |
          git push origin HEAD:main
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"

  # Separate job so a failed publish can be finished with "Re-run failed jobs",
  # which reuses the tag and the uploaded artifacts.
  publish:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download Mac artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac

      - name: Verify tag
        run: git ls-remote --exit-code --tags "https://github.com/$GH_REPO" "refs/tags/$VERSION"

      # Mac builds ship here only; iOS builds go to TestFlight only.
      # Idempotent: a rerun after a partial release only uploads what is missing.
      - name: Create GitHub Release
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --verify-tag --title "$VERSION" --generate-notes
          fi
          gh release upload "$VERSION" "Unteams-$VERSION.zip" "Unteams-$VERSION.dmg" --clobber
